build:
  dockerfile: Dockerfile

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - dtelecomPrivateKey
    properties:
      dtelecomPrivateKey:
        type: string
        description: "Private key (EVM hex or Solana base58) for USDC payments"
  commandFunction:
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { DTELECOM_PRIVATE_KEY: config.dtelecomPrivateKey } })
